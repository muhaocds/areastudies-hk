name: Deploy to Alibaba Cloud OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oss-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      OSS_REGION: cn-hongkong
      OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare website files
        run: |
          mkdir -p site-dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ site-dist/

      - name: Install official ossutil
        run: |
          curl --fail --silent --show-error --location \
            --output ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  ossutil.zip" | sha256sum --check
          unzip -q ossutil.zip
          chmod +x ossutil-2.3.0-linux-amd64/ossutil

      - name: Upload website to OSS
        run: |
          ossutil-2.3.0-linux-amd64/ossutil sync \
            site-dist/ \
            oss://areastudies-cn-site-hk/ \
            --force

      - name: Verify public website
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://areastudies.cn/index.html \
              | grep --fixed-strings "穆浩｜区域国别研究"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
